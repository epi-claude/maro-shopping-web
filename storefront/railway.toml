[build]
  builder = "nixpacks"
  # rm -rf */* (not the dirs themselves) guards against a stale/corrupted
  # persistent .next cache mount causing false "Module not found" webpack
  # errors for files that genuinely exist. These paths are live BuildKit
  # cache mounts at build time, so removing the mount point itself fails
  # with "Device or resource busy" — only their contents can be cleared.
  buildCommand = "rm -rf .next/cache/* node_modules/.cache/* && npm run build"

[deploy]
  startCommand = "npm run start"
  healthcheckPath = "/"
  healthcheckTimeout = 30
  restartPolicyType = "on_failure"
  restartPolicyMaxRetries = 3
  # us-west2's Metal builder pool ("builder-fnerwo") has been stuck at the
  # "scheduling build" stage for every attempt since 2026-07-20 18:40 UTC.
  # Backend deploys fine on us-east4-eqdc4a, so pin storefront to the same
  # healthy region/builder pool.
  region = "us-east4-eqdc4a"
